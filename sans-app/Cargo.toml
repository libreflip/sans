[package]
name = "sans"
version = "0.1.0"
edition = "2021"
description = "Native Sans touchscreen application"

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
sans-core = { path = "../sans-core" }

[dev-dependencies]
egui_kittest = { version = "0.36.1", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
tempfile = "3"
