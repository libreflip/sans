name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libv4l-dev

      - name: Test workspace
        run: cargo test --workspace --locked

  aarch64:
    name: aarch64
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build AArch64 workspace
        run: cross build --workspace --locked --target aarch64-unknown-linux-gnu

      - name: Test AArch64 workspace
        run: cross test --workspace --locked --target aarch64-unknown-linux-gnu
